{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header">
                <h4 class="mb-0">Add New Garden</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Garden Name</label>
                        <input type="text" class="form-control" name="name" required placeholder="e.g. Backyard Raised Bed">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location (Optional)</label>
                        <input type="text" class="form-control" name="location" placeholder="e.g. North Side">
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('gardens.index') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Save Garden</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
