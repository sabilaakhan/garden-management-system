{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header">
                <h4 class="mb-0">Edit Plant</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Plant Name</label>
                        <input type="text" class="form-control" name="name" value="{{ plant.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Species</label>
                        <input type="text" class="form-control" name="species" value="{{ plant.species or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Garden</label>
                        <select class="form-select" name="garden_id" required>
                            {% for garden in gardens %}
                                <option value="{{ garden.garden_id }}" {% if garden.garden_id == plant.garden_id %}selected{% endif %}>{{ garden.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Planted Date</label>
                        <input type="date" class="form-control" name="planted_date" value="{{ plant.planted_date }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control" name="notes" rows="3">{{ plant.notes or '' }}</textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('plants.index') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Update Plant</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
