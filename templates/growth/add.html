{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header">
                <h4 class="mb-0">Add Growth Log</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Plant</label>
                        <select class="form-select" name="plant_id" required>
                            <option value="" disabled selected>Select a plant</option>
                            {% for plant in plants %}
                                <option value="{{ plant.plant_id }}">{{ plant.name }} ({{ plant.garden.name }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Height (e.g. cm, inches)</label>
                        <input type="number" step="0.1" class="form-control" name="height">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Leaf Count</label>
                        <input type="number" class="form-control" name="leaf_count">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control" name="notes" rows="3"></textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('growth.index') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Save Log</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
